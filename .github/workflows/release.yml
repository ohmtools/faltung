name: Release

# Läuft, sobald auf GitHub ein Release veröffentlicht wird:
# 1. baut die App und hängt das Ergebnis als ZIP an das Release
# 2. baut das Container-Image (Build + static-web-server) und veröffentlicht es in der
#    GitHub Container Registry als ghcr.io/<owner>/<repo>
on:
  release:
    types: [published]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      - name: Paket schnüren und an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${GITHUB_REPOSITORY#*/}-${TAG//\//-}.zip"
          (cd dist && zip -qr9 "../$name" .)
          sha256sum "$name" > "$name.sha256"
          gh release upload "$TAG" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  image:
    # Erst veröffentlichen, wenn Lint und Tests oben durchgelaufen sind
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 → Tags v1.2.3, 1.2.3, 1.2; „latest“ nur für reguläre Releases (kein Pre-release)
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_PATH=${{ vars.BASE_PATH || '/' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
