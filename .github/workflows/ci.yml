name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Folgt die App dem ohmtools-Design (Theme, shadcn-Stil, keine Großbuchstaben, die Kopien aus
      # dem Design-Repo unverändert)?
      - run: npx --yes github:ohmtools/design check src/index.css src/styles/ohmtools.css components.json index.html src/*.tsx src/components/*.tsx src/components/**/*.tsx src/lib/ohmtools/*.ts
      - run: npm test
      - run: npm run build
