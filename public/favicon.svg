<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 80 352 352" width="512" height="512">
  <!-- `logo.svg` ohne Hintergrund. Ein schwarzer Saum hinter der weißen Zeitachse hält sie auf
       hellen Tab-Leisten sichtbar. -->
  <g>
    <!-- Saum -->
    <path d="M100 372H412" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
    <!-- f und g -->
    <rect x="124" y="204" width="160" height="156" rx="12" fill="#0D1F3C" stroke="#2563EB" stroke-width="12"/>
    <rect x="228" y="204" width="160" height="156" rx="12" fill="#4A1A04" stroke="#F97316" stroke-width="12"/>
    <!-- Überlappung, schraffiert -->
    <rect x="228" y="204" width="56" height="156" rx="12" fill="#25104D" stroke="#7C3AED" stroke-width="12"/>
    <path d="M238 262L274 226M238 302L274 266M238 342L274 306" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
    <!-- Zeitachse -->
    <path d="M100 372H412" stroke="#FAFAFA" stroke-width="16" stroke-linecap="round"/>
    <!-- Abspielkopf -->
    <path d="M256 372V148" stroke="#DC2626" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="140" r="22" fill="#DC2626"/>
  </g>
</svg>
