<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App-Symbol nach der Vorlage des ohmtools-Designs (assets/app-icon.svg). Hintergrund und
       Rand bleiben, wie sie sind: scripts/app-icons.mjs findet sie an ihrem Radius und an der
       Deckkraft des Rands. Das Glyph bleibt im Kreis mit 40 % Radius (maskable). Flach in den
       Farben des Plots im dunklen Modus: f blau, g orange, die Fläche violett und schraffiert,
       der Abspielkopf rot mit Punkt. -->

  <!-- Squircle backdrop -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#000000"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="111.3" ry="111.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Glyph: g gleitet über f, die Überlappung ist die Faltung an der Stelle des Abspielkopfs -->
  <g>
    <!-- f und g -->
    <rect x="124" y="204" width="160" height="156" rx="12" fill="#0D1F3C" stroke="#2563EB" stroke-width="12"/>
    <rect x="228" y="204" width="160" height="156" rx="12" fill="#4A1A04" stroke="#F97316" stroke-width="12"/>
    <!-- Überlappung, schraffiert -->
    <rect x="228" y="204" width="56" height="156" rx="12" fill="#25104D" stroke="#7C3AED" stroke-width="12"/>
    <path d="M238 262L274 226M238 302L274 266M238 342L274 306" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
    <!-- Zeitachse -->
    <path d="M100 372H412" stroke="#FAFAFA" stroke-width="16" stroke-linecap="round"/>
    <!-- Abspielkopf -->
    <path d="M256 372V148" stroke="#DC2626" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="140" r="22" fill="#DC2626"/>
  </g>
</svg>
