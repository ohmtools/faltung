<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover`: sonst meldet iOS alle Safe-Area-Abstände als 0, und die Tab-Leiste
         läge in der installierten App unter dem Home-Indikator. Die App rückt selbst um
         `env(safe-area-inset-*)` ein. `interactive-widget=resizes-visual`: die Bildschirmtastatur
         ändert nie die Stufe (DESIGN.md, „App shell“). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Setzt shadcns .dark-Klasse vor dem ersten Zeichnen, damit im Dunkelmodus nichts weiß
         aufblitzt; ThemeProvider hält sie danach aktuell. Eine eigene Datei statt Inline-Script,
         damit die Content-Security-Policy ohne Hash auskommt. -->
    <script src="/dark.js"></script>
    <title>Faltung</title>
    <meta
      name="description"
      content="Interaktive Animation der Faltung zweier Funktionen: (f ∗ g)(t) = ∫ f(τ) · g(t − τ) dτ. Läuft komplett im Browser und offline."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS nimmt das Symbol für den Home-Bildschirm nur von hier, nie aus dem Manifest;
         `scripts/app-icons.mjs` rendert es aus `public/logo.svg`. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="Faltung" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
